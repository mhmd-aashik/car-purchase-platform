services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: car-platform-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: car_user
      RABBITMQ_DEFAULT_PASS: car_password
      RABBITMQ_DEFAULT_VHOST: car_platform

    ports:
      - '5672:5672'
      - '15672:15672'

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      
    networks:
      - car-platform-network

  postgres:
    image: postgres:17
    container_name: car-platform-postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_password
      POSTGRES_DB: car_service_db

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U car_user -d car_service_db',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
    networks:
      - car-platform-network

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  car-platform-network:
    driver: bridge
